<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria Express - Balance Express</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: linear-gradient(135deg, #1a1f2e 0%, #232d3d 100%);
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 217, 255, 0.1);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(45, 55, 72, 0.8);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00D9FF 0%, #0D9488 100%);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);
        }

        .content {
            flex: 1;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #e0e7ff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(45, 55, 72, 0.6);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s;
            font-weight: 500;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #00D9FF;
            background: rgba(45, 55, 72, 0.9);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .question {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 24px;
            line-height: 1.6;
            color: #e0e7ff;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            padding: 16px 20px;
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.7) 0%, rgba(58, 69, 86, 0.7) 100%);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 10px;
            color: #e0e7ff;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 217, 255, 0.1);
            transition: left 0.3s;
        }

        .option-btn:hover {
            border-color: #00D9FF;
            background: linear-gradient(135deg, rgba(45, 55, 72, 1) 0%, rgba(58, 69, 86, 1) 100%);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.2);
            color: #00D9FF;
            transform: translateY(-2px);
        }

        .option-btn:hover::before {
            left: 100%;
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            border-color: #00D9FF;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 12px 30px rgba(0, 217, 255, 0.4);
        }

        .buttons-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3de535 0%, #22a016 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 217, 255, 0.5);
        }

        .btn-secondary {
            background: rgba(45, 55, 72, 0.8);
            color: #e0e7ff;
            border: 2px solid rgba(0, 217, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: #00D9FF;
            color: #00D9FF;
            background: rgba(45, 55, 72, 1);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.2);
        }

        .score-section {
            text-align: center;
            margin-bottom: 32px;
            padding: 40px;
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(58, 69, 86, 0.8) 100%);
            border-radius: 14px;
            border-left: 6px solid #00D9FF;
            box-shadow: 0 12px 40px rgba(0, 217, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .score-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        .score-number {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .score-label {
            font-size: 15px;
            color: #a0aec0;
            margin-bottom: 20px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .score-bar {
            width: 100%;
            height: 12px;
            background: rgba(26, 31, 42, 0.6);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #00D9FF 0%, #0D9488 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
        }

        .mundo-card {
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.7) 0%, rgba(58, 69, 86, 0.7) 100%);
            border-left: 5px solid #00D9FF;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0, 217, 255, 0.1);
        }

        .mundo-card:hover {
            transform: translateX(6px);
            box-shadow: 0 12px 32px rgba(0, 217, 255, 0.25);
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.9) 0%, rgba(58, 69, 86, 0.9) 100%);
        }

        .mundo-title {
            font-size: 14px;
            font-weight: 800;
            color: #00D9FF;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mundo-percentage {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mundo-bar {
            width: 100%;
            height: 8px;
            background: rgba(26, 31, 42, 0.6);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .mundo-fill {
            height: 100%;
            background: linear-gradient(90deg, #00D9FF 0%, #0D9488 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mundo-text {
            font-size: 13px;
            color: #cbd5e0;
            line-height: 1.6;
        }

        .cta-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 40px;
            padding: 32px 0;
        }

        .cta-button {
            padding: 28px 20px;
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(58, 69, 86, 0.8) 100%);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 110px;
            gap: 12px;
            letter-spacing: 0.6px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
        }

        .cta-button.btn-calculadora {
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            color: #ffffff;
            border-color: #00D9FF;
        }

        .cta-button.btn-calculadora:hover {
            background: linear-gradient(135deg, #3de535 0%, #22a016 100%);
            box-shadow: 0 16px 45px rgba(0, 217, 255, 0.5);
            border-color: #3de535;
        }

        .cta-button.btn-instagram {
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            border-color: #f09433;
        }

        .cta-button.btn-instagram:hover {
            box-shadow: 0 16px 45px rgba(240, 148, 51, 0.5);
            filter: brightness(1.1);
        }

        .cta-button.btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #1da851 100%);
            color: #ffffff;
            border-color: #25D366;
        }

        .cta-button.btn-whatsapp:hover {
            background: linear-gradient(135deg, #34db7b 0%, #1a9143 100%);
            box-shadow: 0 16px 45px rgba(37, 211, 102, 0.5);
            border-color: #34db7b;
        }

        .cta-button.btn-pdf {
            background: linear-gradient(135deg, #00D9FF 0%, #0D9488 100%);
            color: #ffffff;
            grid-column: 1 / -1;
            font-size: 15px;
            min-height: 60px;
            border-color: #00D9FF;
        }

        .cta-button.btn-pdf:hover {
            background: linear-gradient(135deg, #3de535 0%, #22a016 100%);
            box-shadow: 0 16px 45px rgba(0, 217, 255, 0.5);
            border-color: #3de535;
        }

        .cta-button-icon {
            font-size: 28px;
            font-weight: 800;
            opacity: 0.95;
        }

        .cta-button-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        .insight-box {
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(58, 69, 86, 0.8) 100%);
            border-left: 5px solid #00D9FF;
            padding: 28px;
            border-radius: 12px;
            margin: 32px 0;
            font-size: 15px;
            line-height: 1.8;
            color: #e0e7ff;
            box-shadow: 0 8px 24px rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.1);
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #718096;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(0, 217, 255, 0.1);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .facturacion-insight {
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.8) 0%, rgba(58, 69, 86, 0.8) 100%);
            border-left: 5px solid #00D9FF;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #cbd5e0;
            line-height: 1.7;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 217, 255, 0.1);
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px;
                min-height: auto;
                border-radius: 12px;
            }

            .btn, .cta-button {
                min-width: 120px;
                padding: 12px 20px;
                font-size: 13px;
            }

            .score-number {
                font-size: 42px;
            }

            .logo {
                font-size: 24px;
            }

            .cta-buttons {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- PANTALLA 1: INICIO -->
        <div id="screen-1" class="content">
            <div class="header">
                <div class="logo">Auditoria Express</div>
                <div class="subtitle">Salud Financiera de tu Negocio</div>
            </div>

            <div class="form-group">
                <label>Tu nombre:</label>
                <input type="text" id="dueño" placeholder="Ej: Juan García" />
            </div>

            <div class="form-group">
                <label>Nombre de tu negocio:</label>
                <input type="text" id="negocio" placeholder="Ej: La Ferretería Central" />
            </div>

            <div class="form-group">
                <label>Rubro de tu negocio:</label>
                <input type="text" id="rubro" placeholder="Ej: Almacen, Farmacia, Restaurante..." />
            </div>

            <div class="buttons-group">
                <button class="btn btn-primary" onclick="nextScreen()" translate="no">Empezar Auditoría</button>
            </div>
        </div>

        <!-- PANTALLA 2: PREGUNTAS -->
        <div id="screen-preguntas" class="hidden">
            <div class="header">
                <div class="logo">Auditoria Express</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progreso" style="width: 0%"></div>
            </div>
            <div class="content">
                <div class="question" id="pregunta-texto"></div>
                <div class="options" id="opciones"></div>
            </div>
            <div class="buttons-group">
                <button class="btn btn-secondary" id="btn-anterior" onclick="preguntaAnterior()">Anterior</button>
                <button class="btn btn-secondary" id="btn-siguiente" onclick="siguientePregunta()">Siguiente</button>
            </div>
        </div>

        <!-- PANTALLA 3: FACTURACION -->
        <div id="screen-facturacion" class="hidden">
            <div class="header">
                <div class="logo">Auditoria Express</div>
            </div>

            <div class="content">
                <div class="form-group">
                    <label>¿Cual es tu facturacion mensual aproximada?</label>
                    <div class="options" style="gap: 12px;">
                        <button class="option-btn" onclick="setFacturacion('Menos de $3M', 'menos-3m')">Menos de $3 millones</button>
                        <button class="option-btn" onclick="setFacturacion('Entre $3M y $10M', '3m-10m')">Entre $3M y $10M</button>
                        <button class="option-btn" onclick="setFacturacion('Entre $10M y $20M', '10m-20m')">Entre $10M y $20M</button>
                        <button class="option-btn" onclick="setFacturacion('Mas de $20M', '20m+')">Mas de $20M</button>
                    </div>
                </div>
            </div>

            <div class="buttons-group">
                <button class="btn btn-secondary" onclick="preguntaAnterior()">Anterior</button>
                <button class="btn btn-primary" onclick="verResultados()">Ver Mi Auditoria</button>
            </div>
        </div>

        <!-- PANTALLA 4: RESULTADOS -->
        <div id="screen-resultados" class="hidden">
            <div id="resultados-content">
                <div class="header">
                    <div class="logo">Auditoria Express</div>
                    <div class="subtitle" id="subtitulo-resultado"></div>
                </div>

                <div class="score-section">
                    <div class="score-number" id="score-total">0</div>
                    <div class="score-label" id="score-estado">Cargando...</div>
                    <div class="score-bar">
                        <div class="score-fill" id="score-total-bar" style="width: 0%"></div>
                    </div>
                </div>

                <div id="facturacion-insight" class="facturacion-insight"></div>

                <div id="mundos-resumen"></div>

                <div class="insight-box" id="insight-final"></div>
            </div>

            <div class="cta-buttons">
                <a href="#" class="cta-button btn-calculadora" onclick="abrirCalculadora(event)">
                    <div class="cta-button-icon">∑</div>
                    <div class="cta-button-label">Calculadora</div>
                </a>
                <a href="https://instagram.com/miguel.lladon.ok" target="_blank" rel="noopener noreferrer" class="cta-button btn-instagram">

                    <div class="cta-button-label">WhatsApp</div>
                </a>
                <button class="cta-button btn-pdf" onclick="descargarPDF()">
                    <div class="cta-button-label">↓ Descargar Informe PDF</div>
                </button>
            </div>

            <div class="footer">
                Miguel Lladon | Consultor de Finanzas para Negocios
            </div>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                num: 1, mundo: 1, texto: "¿Sabes que cuando pones precio, el margen real no es el mismo % que el markup?\n\nPor ejemplo: 50% markup = 33% margen real.\n\n¿Conoces esta diferencia?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 2, mundo: 1, texto: "¿Haces cada mes un calculo de: Ventas - Costos - Gastos = Ganancia?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 3, mundo: 1, texto: "¿Sabes cuanto necesitas vender minimo para cubrir todos tus gastos y no perder?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 4, mundo: 1, texto: "¿Si trabajas en tu negocio, te pagas un sueldo fijo cada mes?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No / No aplica", puntos: 0}]
            },
            {
                num: 5, mundo: 1, texto: "¿Controlas qué productos dejan ganancia y cuáles no?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 6, mundo: 2, texto: "¿Tienes un registro de cuanto dinero sacas del negocio cada mes para gastos personales?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 7, mundo: 2, texto: "¿Tienes separadas la cuenta del negocio y la cuenta personal?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 8, mundo: 2, texto: "De lo que gana el negocio, ¿sacas maximo 50% para vos?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 9, mundo: 3, texto: "¿Haces control de stock al menos una vez al mes para detectar cuanta plata tienes ahi?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 10, mundo: 3, texto: "¿Sabes cuanto dinero tienes inmovilizado en productos que no se venden?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 11, mundo: 4, texto: "¿Sabes exactamente cuanto dinero debes a proveedores cada mes?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 12, mundo: 4, texto: "¿Sabes cuanto dinero te deben tus clientes y en cuantos dias pagan?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            },
            {
                num: 13, mundo: 4, texto: "¿Sabes cuantos meses de ganancia necesitas para pagar todas tus deudas?",
                opciones: [{texto: "Si", puntos: 4}, {texto: "No", puntos: 0}]
            }
        ];

        let usuario = {dueño: '', negocio: '', rubro: '', facturacion: '', facturacionKey: '', respuestas: {}};
        let preguntaActual = 0;

        function nextScreen() {
            usuario.dueño = document.getElementById('dueño').value.trim();
            usuario.negocio = document.getElementById('negocio').value.trim();
            usuario.rubro = document.getElementById('rubro').value.trim();

            if (!usuario.dueño || !usuario.negocio || !usuario.rubro) {
                alert('Por favor completa todos los campos');
                return;
            }

            ocultarTodo();
            mostrarPregunta();
        }

        function mostrarPregunta() {
            ocultarTodo();
            document.getElementById('screen-preguntas').classList.remove('hidden');

            const pregunta = preguntas[preguntaActual];
            document.getElementById('pregunta-texto').textContent = pregunta.texto;

            const opcionesDiv = document.getElementById('opciones');
            opcionesDiv.innerHTML = '';

            pregunta.opciones.forEach((opcion, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opcion.texto;
                btn.onclick = () => seleccionarOpcion(opcion.puntos);
                opcionesDiv.appendChild(btn);
            });

            const progreso = ((preguntaActual + 1) / preguntas.length) * 100;
            document.getElementById('progreso').style.width = progreso + '%';

            document.getElementById('btn-anterior').style.display = preguntaActual === 0 ? 'none' : 'inline-flex';
            document.getElementById('btn-siguiente').textContent = preguntaActual === preguntas.length - 1 ? 'Ir a Facturacion' : 'Siguiente';
        }

        function seleccionarOpcion(puntos) {
            const pregunta = preguntas[preguntaActual];
            usuario.respuestas[pregunta.num] = {mundo: pregunta.mundo, puntos: puntos};

            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            setTimeout(() => siguientePregunta(), 300);
        }

        function siguientePregunta() {
            if (preguntaActual < preguntas.length - 1) {
                preguntaActual++;
                mostrarPregunta();
            } else {
                mostrarFacturacion();
            }
        }

        function preguntaAnterior() {
            if (preguntaActual > 0) {
                preguntaActual--;
                mostrarPregunta();
            }
        }

        function mostrarFacturacion() {
            ocultarTodo();
            document.getElementById('screen-facturacion').classList.remove('hidden');
        }

        function setFacturacion(label, key) {
            usuario.facturacion = label;
            usuario.facturacionKey = key;

            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            setTimeout(() => verResultados(), 300);
        }

        function verResultados() {
            const scores = {1: 0, 2: 0, 3: 0, 4: 0};
            // Los maximos se calculan desde las preguntas reales:
            // asi nunca se desfasan si se agrega, saca o mueve una pregunta de mundo.
            const maximos = {1: 0, 2: 0, 3: 0, 4: 0};
            preguntas.forEach((p) => {
                maximos[p.mundo] += Math.max(...p.opciones.map(o => o.puntos));
            });

            for (let num in usuario.respuestas) {
                const resp = usuario.respuestas[num];
                scores[resp.mundo] += resp.puntos;
            }

            const porcentajes = {
                1: Math.round((scores[1] / maximos[1]) * 100),
                2: Math.round((scores[2] / maximos[2]) * 100),
                3: Math.round((scores[3] / maximos[3]) * 100),
                4: Math.round((scores[4] / maximos[4]) * 100)
            };

            const scoreTotal = Math.round((Object.values(porcentajes).reduce((a, b) => a + b, 0)) / 4);
            usuario.scores = porcentajes;
            usuario.scoreTotal = scoreTotal;

            mostrarResultados();
        }

        function mostrarResultados() {
            ocultarTodo();
            document.getElementById('screen-resultados').classList.remove('hidden');

            document.getElementById('subtitulo-resultado').textContent = `${usuario.negocio} | ${usuario.rubro}`;

            document.getElementById('score-total').textContent = usuario.scoreTotal;
            document.getElementById('score-total-bar').style.width = usuario.scoreTotal + '%';

            let estado = '';
            if (usuario.scoreTotal <= 25) estado = '🔴 CRITICO';
            else if (usuario.scoreTotal <= 50) estado = '🟠 ALERTA';
            else if (usuario.scoreTotal <= 75) estado = '🟡 BIEN';
            else estado = '🟢 EXCELENTE';

            document.getElementById('score-estado').textContent = estado;

            const facturacionTexto = document.getElementById('facturacion-insight');
            const fuga5Mes = Math.round(facturacionNumero() * 0.05);
            const fuga5Anio = fuga5Mes * 12;
            const pesos = (n) => '$' + n.toLocaleString('es-AR');

            facturacionTexto.innerHTML = `
                <strong>Tu facturacion: ${usuario.facturacion}</strong><br><br>
                Nadie puede decirte hoy cuanto estas perdiendo exactamente — ese es justamente el problema.
                Pero si podemos poner el orden de magnitud sobre la mesa.<br><br>
                Imaginate una fuga chica, del <strong style="color: #00D9FF;">5%</strong>: un margen mal calculado,
                un descuento que se come la ganancia, mercaderia que no rota.<br><br>
                Serian <strong style="color: #00D9FF;">${pesos(fuga5Mes)} por mes</strong> ·
                <strong style="color: #00D9FF;">${pesos(fuga5Anio)} en un año</strong>
            `;

            const mundosDiv = document.getElementById('mundos-resumen');
            mundosDiv.innerHTML = '';

            const mundosData = {
                1: {
                    titulo: 'Mundo 1: Economico',
                    descripcion: '¿Cuanto realmente GANAS?',
                    critico: 'No sabes tu ganancia real. Sin numeros, no puedes decidir nada.',
                    alerta: 'Tienes idea, pero no es clara. Hay fugas que no ves.',
                    bien: 'Conoces tu ganancia. Falta optimizar márgenes y punto de equilibrio.',
                    excelente: 'Rentabilidad clara. Sabes cuanto necesitas vender y cuanto queda.'
                },
                2: {
                    titulo: 'Mundo 2: Personal',
                    descripcion: '¿Que dinero es TUYO?',
                    critico: 'Mezclas negocio y personal. La ganancia se disuelve sin control.',
                    alerta: 'Sacas dinero, pero no sabes si asfixias el negocio.',
                    bien: 'Tienes control. Falta optimizar cuanto retiras realmente.',
                    excelente: 'Separacion clara. Sueldo definido y retiros controlados al 50%.'
                },
                3: {
                    titulo: 'Mundo 3: Stock',
                    descripcion: '¿Donde esta congelada la plata?',
                    critico: 'No inventarias. Plata inmovilizada sin control. Perdida invisible.',
                    alerta: 'Inventarias, pero no mides el costo de lo que no se vende.',
                    bien: 'Controlas stock. Falta optimizar rotacion y capital atrapado.',
                    excelente: 'Inventario claro. Rotacion optima. Plata circula como debe.'
                },
                4: {
                    titulo: 'Mundo 4: Liquidez',
                    descripcion: '¿Cuando llega la plata?',
                    critico: 'No sabes deudas ni cobranzas. Flujo caótico. Crisis permanente.',
                    alerta: 'Sabes algo, pero el flujo es impredecible. Sorpresas constantes.',
                    bien: 'Conoces deudas y cobranzas. Falta predecir el flujo mensual.',
                    excelente: 'Flujo predecible. Sabes cuanto debes, cuanto te deben, cuanto viaja.'
                }
            };

            for (let m = 1; m <= 4; m++) {
                const card = document.createElement('div');
                card.className = 'mundo-card';

                let estadoMundo = '';
                let insight = '';
                if (usuario.scores[m] <= 25) {
                    estadoMundo = '🔴 CRITICO';
                    insight = mundosData[m].critico;
                } else if (usuario.scores[m] <= 50) {
                    estadoMundo = '🟠 ALERTA';
                    insight = mundosData[m].alerta;
                } else if (usuario.scores[m] <= 75) {
                    estadoMundo = '🟡 BIEN';
                    insight = mundosData[m].bien;
                } else {
                    estadoMundo = '🟢 EXCELENTE';
                    insight = mundosData[m].excelente;
                }

                card.innerHTML = `
                    <div class="mundo-title">
                        <span>${mundosData[m].titulo}</span>
                        <span class="mundo-percentage">${usuario.scores[m]}%</span>
                    </div>
                    <div class="mundo-bar">
                        <div class="mundo-fill" style="width: ${usuario.scores[m]}%"></div>
                    </div>
                    <div class="mundo-text" style="margin-top: 16px; font-size: 14px; color: #00D9FF; font-weight: 600; margin-bottom: 12px;">
                        ${estadoMundo}
                    </div>
                    <div class="mundo-text">
                        <strong>${mundosData[m].descripcion}</strong><br>
                        ${insight}
                    </div>
                `;

                mundosDiv.appendChild(card);
            }

            // ===== DIAGNOSTICO EN PANTALLA =====
            const d = construirDiagnostico();

            document.getElementById('insight-final').innerHTML = `
                <strong style="font-size: 18px;">${d.titulo}</strong><br><br>
                ${d.parrafo}<br><br>
                <strong>Por donde empezar:</strong> ${d.prioridad}
            `;
        }

        // ===== MOTOR DE DIAGNOSTICO =====
        function facturacionNumero() {
            return usuario.facturacionKey === 'menos-3m' ? 2000000 :
                   usuario.facturacionKey === '3m-10m' ? 6500000 :
                   usuario.facturacionKey === '10m-20m' ? 15000000 : 25000000;
        }

        function construirDiagnostico() {
            const s = usuario.scoreTotal;
            const m1 = usuario.scores[1];

            let titulo = '';
            let parrafo = '';

            if (s <= 25) {
                titulo = 'Tu negocio se mueve. Pero hoy no hay forma de saber que deja.';
                parrafo = `Vendes, atendes y trabajas todos los dias, pero las decisiones se apoyan en la caja y en la intuicion. Eso no significa que el negocio este mal: significa que no tenes con que comprobarlo. Y mientras no haya numeros, cada compra de stock, cada retiro y cada precio que pones son una apuesta. El riesgo no es equivocarse una vez — es repetir el mismo error doce meses seguidos sin verlo.`;
            } else if (s <= 50) {
                titulo = 'Tenes partes claras. El problema es lo que queda afuera.';
                parrafo = `Hay orden en algunos frentes, pero la foto todavia esta incompleta — y una foto incompleta se lee igual de mal que ninguna. Hoy podes estar tomando buenas decisiones en un mundo mientras otro te drena plata en silencio. Los cuatro mundos no se compensan entre si: la rentabilidad no arregla un stock inmovilizado, y un buen flujo no te dice si estas ganando.`;
            } else if (s <= 75) {
                titulo = 'Tenes base. Ahora te falta que los cuatro mundos cierren juntos.';
                parrafo = `Estas por encima de la mayoria de los negocios de tu tamaño: hay control y hay criterio. Pero la claridad financiera no se promedia — se sostiene. Alcanza con que un solo mundo quede flojo para que las decisiones grandes (contratar, invertir, retirar mas, aguantar un mes malo) vuelvan a tomarse a ciegas. Lo que te falta no es mucho. Es lo que te esta frenando.`;
            } else {
                titulo = 'Tenes claridad real. Eso te pone en un lugar distinto.';
                parrafo = `Sabes lo que entra, lo que cuesta, lo que queda y cuando llega. Con eso ya no estas gestionando el dia a dia: estas conduciendo el negocio. De aca en adelante el trabajo cambia de naturaleza — no se trata de ordenar, se trata de usar esos numeros para decidir mas rapido y mas grande que tu competencia, que sigue mirando la caja.`;
            }

            let prioridad = '';
            if (m1 <= 50) {
                prioridad = `El Mundo 1 — Economico. Antes que cualquier otra cosa, tenes que saber si el negocio es realmente rentable. Ese numero es el piso de todo: sin el, ordenar stock, retiros o cobranzas es acomodar muebles sin saber si la casa se sostiene. Una vez que sabes cuanto deja el negocio, los otros tres mundos te dan lo demas — decidir sin miedo, crecer sin arriesgar todo y aguantar los meses malos sin sorpresas.`;
            } else {
                prioridad = `Tu Mundo 1 — Economico ya tiene base: sabes si el negocio es rentable, y ese es el piso de todo. El paso siguiente es cerrar los mundos que quedaron flojos, porque son los que hoy te impiden proyectar con tranquilidad: cuanto podes retirar, cuanta plata tenes dormida y cuando entra realmente el dinero. Con esos cuatro alineados el negocio se vuelve predecible — y un negocio predecible se adapta a cualquier cambio sin que vos tengas que adivinar.`;
            }

            return {titulo, parrafo, prioridad};
        }

        function descargarPDF() {
            if (!window.jspdf || !window.jspdf.jsPDF) {
                alert('No se pudo cargar el generador de PDF. Revisa tu conexion e intenta de nuevo.');
                return;
            }

            const fact = facturacionNumero();
            const fmt = (n) => '$' + Math.round(n).toLocaleString('es-AR');

            const montos = {
                estado: usuario.scoreTotal <= 25 ? 'NIVEL CRITICO' :
                        usuario.scoreTotal <= 50 ? 'NIVEL ALERTA' :
                        usuario.scoreTotal <= 75 ? 'NIVEL INTERMEDIO' : 'NIVEL ALTO',
                fecha: new Date().toLocaleDateString('es-AR'),
                fugaMes: fmt(fact * 0.05),
                fugaAnio: fmt(fact * 0.05 * 12)
            };

            try {
                const doc = construirPDF(window.jspdf.jsPDF, usuario, construirDiagnostico(), montos);
                doc.save('Auditoria_Salud_Financiera_' + usuario.negocio.replace(/[^a-zA-Z0-9]+/g, '_') + '.pdf');
            } catch (e) {
                alert('No se pudo generar el PDF: ' + e.message);
            }
        }

        // ===== GENERADOR DE INFORME PDF (texto nativo, sin rasterizado) =====
        function construirPDF(jsPDFClass, usuario, d, montos) {
            const doc = new jsPDFClass({orientation: 'portrait', unit: 'mm', format: 'a4'});

            const PW = 210, PH = 297;
            const ML = 18, MR = 18;
            const W = PW - ML - MR;          // 174mm util
            const TOP = 18, BOT = 17;

            const TURQ    = [8, 145, 168];
            const TURQ_CL = [0, 200, 235];
            const OSCURO  = [15, 34, 48];
            const TEXTO   = [61, 78, 89];
            const GRIS    = [122, 139, 150];
            const LINEA   = [223, 232, 238];
            const FONDO_T = [240, 251, 253];
            const ROJO    = [201, 48, 44];
            const FONDO_R = [253, 242, 242];

            let y = TOP;
            let pagina = 1;

            const alto = (texto, size, maxW, lh) => {
                doc.setFontSize(size);
                return doc.splitTextToSize(texto, maxW).length * (size * 0.3528 * (lh || 1.45));
            };

            const nuevaPagina = () => {
                pie();
                doc.addPage();
                pagina++;
                y = TOP;
            };

            const espacio = (necesario) => {
                if (y + necesario > PH - BOT) nuevaPagina();
            };

            const pie = () => {
                doc.setDrawColor(...LINEA);
                doc.setLineWidth(0.2);
                doc.line(ML, PH - 14, PW - MR, PH - 14);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7);
                doc.setTextColor(...GRIS);
                doc.text('Auditoria Express  ·  Miguel Lladon, Consultor de Finanzas para Negocios', ML, PH - 10);
                doc.text(String(pagina), PW - MR, PH - 10, {align: 'right'});
            };

            // Parrafo justificado con salto de pagina automatico
            const parrafo = (texto, size, color, lh, estilo) => {
                doc.setFont('helvetica', estilo || 'normal');
                doc.setFontSize(size);
                doc.setTextColor(...(color || TEXTO));
                const lineas = doc.splitTextToSize(texto, W);
                const salto = size * 0.3528 * (lh || 1.5);
                lineas.forEach((ln) => {
                    if (y + salto > PH - BOT) nuevaPagina();
                    doc.text(ln, ML, y, {maxWidth: W});
                    y += salto;
                });
            };

            const seccion = (numero, titulo) => {
                espacio(16);
                y += 3;
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(7.5);
                doc.setTextColor(...TURQ);
                doc.text(numero + '   ·   ' + titulo.toUpperCase(), ML, y, {charSpace: 0.5});
                y += 2.5;
                doc.setDrawColor(...TURQ_CL);
                doc.setLineWidth(0.6);
                doc.line(ML, y, PW - MR, y);
                y += 5;
            };

            // ---------- CABECERA ----------
            doc.setFillColor(...TURQ_CL);
            doc.rect(0, 0, PW, 3.5, 'F');

            y = 22;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(...TURQ);
            doc.text('AUDITORIA DE SALUD FINANCIERA', ML, y, {charSpace: 1});

            y += 9;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(23);
            doc.setTextColor(...OSCURO);
            const nombre = doc.splitTextToSize(usuario.negocio, W);
            nombre.slice(0, 2).forEach((ln) => { doc.text(ln, ML, y); y += 9; });

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(...GRIS);
            doc.text(usuario.rubro + '   ·   ' + usuario.dueño + '   ·   ' + montos.fecha, ML, y);
            y += 8;

            // ---------- INDICE ----------
            const cajaY = y;
            const cajaH = 32;
            doc.setFillColor(...FONDO_T);
            doc.rect(ML, cajaY, W, cajaH, 'F');
            doc.setFillColor(...TURQ_CL);
            doc.rect(ML, cajaY, 1.6, cajaH, 'F');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7);
            doc.setTextColor(...TURQ);
            doc.text('INDICE DE CLARIDAD FINANCIERA', ML + 8, cajaY + 7.5, {charSpace: 0.8});

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(30);
            doc.setTextColor(...TURQ);
            doc.text(usuario.scoreTotal + '%', ML + 8, cajaY + 19.5);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(9);
            doc.setTextColor(...OSCURO);
            doc.text(montos.estado, ML + 38, cajaY + 19.5);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(...TEXTO);
            doc.text('Facturacion declarada: ' + usuario.facturacion + ' por mes', ML + 8, cajaY + 27.5);

            y = cajaY + cajaH + 3;

            // ---------- 01 LECTURA GENERAL ----------
            seccion('01', 'Lectura general');
            espacio(alto(d.titulo, 13, W, 1.35) + 8);
            parrafo(d.titulo, 13, OSCURO, 1.35, 'bold');
            y += 3;
            parrafo(d.parrafo, 10, TEXTO, 1.6);

            // ---------- 02 LOS CUATRO MUNDOS ----------
            seccion('02', 'Tus cuatro mundos');

            const mundos = [
                ['Economico', '¿El negocio es realmente rentable?', usuario.scores[1]],
                ['Personal',  '¿Cuanto de esa plata es tuya?',      usuario.scores[2]],
                ['Stock',     '¿Cuanta plata esta dormida?',        usuario.scores[3]],
                ['Liquidez',  '¿Cuando entra y cuando sale?',       usuario.scores[4]]
            ];

            const etiqueta = (v) => v <= 25 ? 'Sin claridad' : v <= 50 ? 'Claridad parcial' : v <= 75 ? 'Buena base' : 'Claridad alta';

            mundos.forEach(([nom, preg, val]) => {
                espacio(17);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(...OSCURO);
                doc.text(nom, ML, y);

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(13);
                doc.setTextColor(...TURQ);
                doc.text(val + '%', PW - MR, y + 0.5, {align: 'right'});

                y += 4.5;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8);
                doc.setTextColor(...GRIS);
                doc.text(preg, ML, y);
                doc.text(etiqueta(val), PW - MR, y, {align: 'right'});

                y += 3;
                doc.setFillColor(...LINEA);
                doc.rect(ML, y, W, 1.6, 'F');
                doc.setFillColor(...TURQ_CL);
                if (val > 0) doc.rect(ML, y, W * (val / 100), 1.6, 'F');

                y += 6.5;
            });

            // ---------- 03 EL COSTO DE NO VERLO ----------
            seccion('03', 'El costo de no verlo');
            parrafo(
                'No podemos decirte cuanto estas perdiendo hoy: justamente, ese es el problema — nadie puede, ni vos. ' +
                'Pero si podemos poner el orden de magnitud sobre la mesa. Con tu nivel de facturacion, imaginate una fuga ' +
                'chica, del 5%: un margen mal calculado, un descuento que se come la ganancia, mercaderia que no rota, ' +
                'un gasto que nadie revisa.', 10, TEXTO, 1.6);

            y += 2;
            espacio(32);
            const rY = y;
            doc.setFillColor(...FONDO_R);
            doc.rect(ML, rY, W, 29, 'F');
            doc.setFillColor(...ROJO);
            doc.rect(ML, rY, 1.6, 29, 'F');

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(...ROJO);
            doc.text('Una fuga del 5% sobre tu facturacion', ML + 8, rY + 7.5);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(17);
            doc.text(montos.fugaMes + ' por mes', ML + 8, rY + 16);
            doc.setFontSize(12);
            doc.text(montos.fugaAnio + ' en un año', ML + 8, rY + 23);

            y = rY + 33;
            parrafo('Una fuga chica todos los meses no es chica: es una perdida anual disfrazada. Y cada mes que pasa ' +
                    'sin verla no se recupera — se suma.', 9, TEXTO, 1.55, 'bold');

            // ---------- 04 POR DONDE EMPEZAR ----------
            seccion('04', 'Por donde empezar');
            parrafo(d.prioridad, 10, TEXTO, 1.6);

            // ---------- 05 PLAN DE ACCION ----------
            seccion('05', 'Plan de accion');

            const pasos = [
                ['01', 'Medir la ganancia real',
                 'Armar el estado de resultados del mes: ventas, costo de lo vendido, gastos, ganancia. Es la unica herramienta que te dice si el negocio es rentable. Todo lo demas se apoya en ese numero.'],
                ['02', 'Separar tu sueldo de la ganancia',
                 'Si trabajas en el negocio, tu sueldo es un costo mas y va antes de la ganancia. Lo que retiras despues sale de la ganancia, no de la caja. Mezclar las dos cosas es lo que hace que el negocio parezca rentable cuando no lo es.'],
                ['03', 'Revisar precios y margenes',
                 'Markup y margen no son lo mismo: un 50% de markup deja 33% de margen. Si pones precios o descuentos con el numero equivocado, estas regalando ganancia en cada venta sin enterarte.'],
                ['04', 'Despertar la plata dormida',
                 'Contar el stock y separar lo que rota de lo que no. La mercaderia que no se vende no es stock: es plata inmovilizada que podria estar trabajando en otra cosa.'],
                ['05', 'Hacer el flujo predecible',
                 'Saber cuanto debes, cuanto te deben y en cuantos dias entra cada peso. Un negocio rentable puede quedarse sin caja; con el flujo claro, eso deja de ser una sorpresa.']
            ];

            pasos.forEach(([n, tit, txt]) => {
                const hTxt = alto(txt, 9, W - 12, 1.55);
                espacio(hTxt + 11);

                const pY = y;
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(12);
                doc.setTextColor(...TURQ_CL);
                doc.text(n, ML, pY + 1);

                doc.setFontSize(10);
                doc.setTextColor(...OSCURO);
                doc.text(tit, ML + 12, pY + 1);

                y = pY + 5;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                doc.setTextColor(...TEXTO);
                const ls = doc.splitTextToSize(txt, W - 12);
                ls.forEach((ln) => {
                    if (y + 4.6 > PH - BOT) nuevaPagina();
                    doc.text(ln, ML + 12, y);
                    y += 4.4;
                });
                y += 3.8;
            });

            // ---------- LO QUE SE ABRE ----------
            const txtAbre = 'Decidir sin miedo. Saber si podes contratar, si podes invertir, si podes retirar mas este mes sin ' +
                'comprometer el que viene. Proyectar a doce meses y saber que el negocio lo banca. Aguantar un mes malo sin ' +
                'que sea una crisis. Adaptarte rapido cuando cambia el contexto, porque ves el impacto antes de que te pase ' +
                'por encima. En una frase: manejar el negocio, en vez de que el negocio te maneje a vos.';

            const hAbre = alto(txtAbre, 9.5, W - 16, 1.6) + 16;
            espacio(hAbre + 3);
            y += 1;
            const aY = y;
            doc.setFillColor(...FONDO_T);
            doc.rect(ML, aY, W, hAbre, 'F');
            doc.setFillColor(...TURQ_CL);
            doc.rect(ML, aY, 1.6, hAbre, 'F');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(...OSCURO);
            doc.text('Lo que se abre cuando tenes los numeros', ML + 8, aY + 8.5);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9.5);
            doc.setTextColor(...TEXTO);
            let ay = aY + 15;
            doc.splitTextToSize(txtAbre, W - 16).forEach((ln) => {
                doc.text(ln, ML + 8, ay);
                ay += 4.7;
            });

            y = aY + hAbre + 6;

            // ---------- CIERRE ----------
            espacio(46);
            const cY = y;
            doc.setFillColor(...OSCURO);
            doc.rect(ML, cY, W, 42, 'F');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.setTextColor(...TURQ_CL);
            doc.text('Vender no es ganar.', ML + 9, cY + 11);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(9);
            doc.setTextColor(225, 235, 241);
            let zy = cY + 18.5;
            doc.splitTextToSize('Si queres que armemos juntos estos numeros para tu negocio, escribime por WhatsApp con la ' +
                'palabra AVANZAR y vemos por donde arrancar.', W - 18).forEach((ln) => {
                doc.text(ln, ML + 9, zy);
                zy += 4.4;
            });

            // --- Botones clicables: WhatsApp e Instagram ---
            const btnY = cY + 26;
            const btnH = 9.5;
            const btnW = (W - 18 - 5) / 2;

            // WhatsApp
            doc.setFillColor(37, 211, 102);
            doc.roundedRect(ML + 9, btnY, btnW, btnH, 1.6, 1.6, 'F');
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8.5);
            doc.setTextColor(255, 255, 255);
            doc.text('WhatsApp  385 515 9169', ML + 9 + btnW / 2, btnY + 6.2, {align: 'center'});
            doc.link(ML + 9, btnY, btnW, btnH, {url: 'https://wa.me/5493855159169?text=AVANZAR'});

            // Instagram
            doc.setFillColor(200, 46, 110);
            doc.roundedRect(ML + 9 + btnW + 5, btnY, btnW, btnH, 1.6, 1.6, 'F');
            doc.setTextColor(255, 255, 255);
            doc.text('Instagram  @miguel.lladon.ok', ML + 9 + btnW + 5 + btnW / 2, btnY + 6.2, {align: 'center'});
            doc.link(ML + 9 + btnW + 5, btnY, btnW, btnH, {url: 'https://instagram.com/miguel.lladon.ok'});

            pie();
            return doc;
        }
        function abrirCalculadora(e) {
            e.preventDefault();
            window.open('https://docs.google.com/spreadsheets/d/1RCO3AAGgFkUBrqtZfjDwDXxFM5YBJi3eMWaiiuXFmG8/edit?usp=sharing', '_blank');
        }

        function ocultarTodo() {
            document.getElementById('screen-1').classList.add('hidden');
            document.getElementById('screen-preguntas').classList.add('hidden');
            document.getElementById('screen-facturacion').classList.add('hidden');
            document.getElementById('screen-resultados').classList.add('hidden');
        }

        window.onload = () => {
            ocultarTodo();
            document.getElementById('screen-1').classList.remove('hidden');
        };
    </script>
